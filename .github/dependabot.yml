# Еженедельные PR с обновлениями, в том числе исправлениями уязвимостей
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /docker/prod
      - /docker/php
    schedule:
      interval: weekly

  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
