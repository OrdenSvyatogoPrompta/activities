name: Deploy

# Каждый push в main (в том числе мерж PR): сразу собираются и публикуются образы,
# затем задача deploy ждёт ручного подтверждения — кнопка «Review deployments» в запуске.
# Ожидание задаёт защита окружения production (Settings → Environments → production →
# Required reviewers), а не этот файл.
on:
  push:
    branches: [main]
  workflow_dispatch:

# По умолчанию — никаких прав; каждой задаче выдаются только нужные
permissions: {}

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [web, backend]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/${{ matrix.image }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Подписанная информация о том, как собран образ, и список его пакетов
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Выкатывает образы, собранные задачей build этого же запуска (тег = SHA коммита).
  # Запускается после подтверждения в окружении production; повторная выкатка без
  # пересборки — «Re-run» только этой задачи.
  deploy:
    name: Deploy to production
    needs: build
    # Выкатывать в прод можно только из main
    if: github.ref == 'refs/heads/main'
    # Не выкатывать два запуска одновременно. Блокировка только на этой задаче,
    # чтобы запуск, ожидающий подтверждения, не задерживал сборку следующего мержа
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || 'activities' }}
      DOMAIN: ${{ vars.DOMAIN }}
      SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check configuration
        run: |
          if [ -z "$DOMAIN" ]; then
            echo "::error::Не задана переменная окружения DOMAIN (Settings → Environments → production)"
            exit 1
          fi

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # StrictHostKeyChecking=yes: подключаться только к серверу из SSH_KNOWN_HOSTS
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  Port %s\n' "$SSH_PORT" > ~/.ssh/config

      # Значения в одинарных кавычках: compose не раскрывает в них $ и спецсимволы.
      # PEM-ключи JWT многострочные — compose читает многострочные значения в кавычках
      - name: Prepare .env
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          JWT_PASSPHRASE: ${{ secrets.JWT_PASSPHRASE }}
        run: |
          for name in JWT_SECRET_KEY JWT_PUBLIC_KEY JWT_PASSPHRASE; do
            if [ -z "${!name}" ]; then
              echo "::error::Не задан секрет $name (Settings → Environments → production)"
              exit 1
            fi
          done
          umask 077
          {
            echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "TAG=${GITHUB_SHA}"
            echo "DOMAIN=${DOMAIN}"
            printf "APP_SECRET='%s'\n" "$APP_SECRET"
            printf "MYSQL_PASSWORD='%s'\n" "$MYSQL_PASSWORD"
            printf "MYSQL_ROOT_PASSWORD='%s'\n" "$MYSQL_ROOT_PASSWORD"
            printf "JWT_SECRET_KEY='%s'\n" "$JWT_SECRET_KEY"
            printf "JWT_PUBLIC_KEY='%s'\n" "$JWT_PUBLIC_KEY"
            printf "JWT_PASSPHRASE='%s'\n" "$JWT_PASSPHRASE"
          } > .env.prod

      - name: Upload files
        run: |
          ssh "$SSH_TARGET" "install -d -m 700 '$DEPLOY_PATH'"
          scp docker-compose.prod.yml "$SSH_TARGET:$DEPLOY_PATH/docker-compose.yml"
          scp docker/prod/Caddyfile "$SSH_TARGET:$DEPLOY_PATH/Caddyfile"
          scp .env.prod "$SSH_TARGET:$DEPLOY_PATH/.env"
          ssh "$SSH_TARGET" "chmod 600 '$DEPLOY_PATH/.env'"

      # Токен передаётся через stdin (не попадает в аргументы процессов и на диск сервера,
      # кроме ~/.docker/config.json на время pull) и удаляется trap'ом при любом исходе.
      # Миграции применяются новым образом бэкенда до перезапуска сервисов: сначала
      # поднимается MySQL, затем одноразовый контейнер выполняет doctrine:migrations:migrate.
      # </dev/null: иначе docker compose run/exec прочитает остаток этого скрипта из stdin
      - name: Pull images, migrate and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh "$SSH_TARGET" bash -s -- "$DEPLOY_PATH" <<EOF
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          cd "\$1"
          printf '%s' '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin
          docker compose pull
          docker logout ghcr.io
          docker compose up -d mysql
          for attempt in \$(seq 1 60); do
            if docker compose exec -T mysql mysqladmin ping -h 127.0.0.1 --silent </dev/null >/dev/null 2>&1; then
              break
            fi
            if [ "\$attempt" -eq 60 ]; then
              echo "MySQL не поднялся за 2 минуты" >&2
              exit 1
            fi
            sleep 2
          done
          docker compose run --rm -T backend php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration </dev/null
          docker compose up -d --remove-orphans
          docker image prune -f
          EOF

      - name: Clean up
        if: always()
        run: rm -f .env.prod ~/.ssh/id_deploy
