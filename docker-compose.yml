services:
  web:
    image: nginx:alpine
    container_name: activities
    ports:
      - "127.0.0.1:8080:80"
      # MCP-сервер page-preview работает в сети этого контейнера, поэтому его
      # порт публикуется здесь
      - "127.0.0.1:8931:8931"
    volumes:
      - type: bind
        source: ./
        target: /var/www
      - type: bind
        source: ./docker/default.conf
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    volumes:
      - ./:/app
      - angular-cache:/app/frontend/.angular   # lmdb-кэш Angular падает на bind-mount
    command: corepack yarn start --host 0.0.0.0

  backend:
    build: ./docker/php
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    environment:
      # В test-окружении Doctrine добавляет к имени базы суффикс _test → activities_test
      DATABASE_URL: "mysql://activities:activities@mysql:3306/activities?serverVersion=8.4&charset=utf8mb4"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: activities
      MYSQL_USER: activities
      MYSQL_PASSWORD: activities
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql

  # MCP-сервер для Claude Code: браузер для просмотра страниц (только локальная
  # разработка, в docker-compose.prod.yml его нет). Без авторизации — порт
  # открыт только на 127.0.0.1. Делит сеть с web, поэтому сайт из браузера
  # открывается по http://127.0.0.1/ (nginx внутри слушает 80).
  page-preview:
    image: mcr.microsoft.com/playwright/mcp:v0.0.85
    # --headless, --browser chromium и --no-sandbox уже заданы в entrypoint образа
    command:
      - --isolated
      - --host=0.0.0.0
      - --port=8931
      - --allowed-hosts=localhost:8931,127.0.0.1:8931
      - --viewport-size=1440x900
    network_mode: "service:web"
    depends_on:
      - web

volumes:
  angular-cache:
  mysql-data:

networks:
  default:
    name: activities.loc
