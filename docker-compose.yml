services:
  web:
    image: nginx:alpine
    container_name: activities
    labels:
      traefik.enable: "true"
      traefik.http.routers.activities.rule: Host(`activities.loc`)
    networks:
      vldev.loc: {}
    volumes:
      - type: bind
        source: ./
        target: /var/www
      - type: bind
        source: ./docker/default.conf
        target: /etc/nginx/conf.d/default.conf

networks:
  vldev.loc:
    external: true
