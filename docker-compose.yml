services:
  web:
    image: nginx:alpine
    container_name: activities
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - type: bind
        source: ./
        target: /var/www
      - type: bind
        source: ./docker/default.conf
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    volumes:
      - ./:/app
      - angular-cache:/app/frontend/.angular   # lmdb-кэш Angular падает на bind-mount
    command: corepack yarn start --host 0.0.0.0

  backend:
    build: ./docker/php
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    environment:
      DATABASE_URL: "mysql://activities:activities@mysql:3306/activities?serverVersion=8.4"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: activities
      MYSQL_USER: activities
      MYSQL_PASSWORD: activities
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  angular-cache:
  mysql-data:

networks:
  default:
    name: activities.loc
