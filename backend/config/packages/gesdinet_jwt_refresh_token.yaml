gesdinet_jwt_refresh_token:
    refresh_token_class: App\Entity\RefreshToken

    # 30 дней
    ttl: 2592000

    # Ротация: каждый refresh выдаёт новый refresh-токен, использованный удаляется
    single_use: true

    # Имя cookie с refresh-токеном
    token_parameter_name: refresh_token

    # Refresh-токен только в HttpOnly cookie, в теле ответа его нет.
    # Path=/api/auth: браузер отправляет cookie только на refresh и logout.
    cookie:
        enabled: true
        http_only: true
        secure: true
        same_site: strict
        path: /api/auth
        remove_token_from_body: true
