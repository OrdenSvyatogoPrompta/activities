security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # Пользователи из БД; поиск по email без учёта регистра — UserRepository::loadUserByIdentifier()
        app_user_provider:
            entity:
                class: App\Entity\User

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider

            # Точек входа две (jwt и refresh_jwt), поэтому нужная указана явно: запрос без
            # токена к защищённому маршруту получает 401 от JWT-аутентификатора
            entry_point: jwt

            # POST /api/auth/login { email, password } → access-токен в теле ответа,
            # refresh-токен в cookie (её ставит gesdinet по событию успешного входа lexik)
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

            # 5 попыток в минуту на пару email + IP
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

            # POST /api/auth/refresh — refresh-токен из cookie; TTL и ротация —
            # в gesdinet_jwt_refresh_token.yaml
            refresh_jwt:
                check_path: /api/auth/refresh

            # Authorization: Bearer <access>
            jwt: ~

            # POST /api/auth/logout — gesdinet удаляет refresh-токен и чистит cookie.
            # Маршрут создаёт security.route_loader.logout (config/routes/security.yaml)
            logout:
                path: /api/auth/logout

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/api/auth/(register|login|refresh)$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/api/clubs(/|$), methods: [GET, HEAD], roles: PUBLIC_ACCESS }
        - { path: ^/api/ping$, methods: [GET, HEAD], roles: PUBLIC_ACCESS }
        - { path: ^/api/dictionaries$, methods: [GET, HEAD], roles: PUBLIC_ACCESS }
        - { path: ^/api/admin(/|$), roles: ROLE_ADMIN }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
