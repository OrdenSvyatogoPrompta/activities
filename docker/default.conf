server {
    listen 80 default;
    server_name activities;

    # Встроенный DNS Docker. Апстримы заданы через переменные, поэтому nginx
    # резолвит их на каждый запрос, а не при старте: если backend или frontend
    # не запущен, nginx всё равно стартует и отвечает 502 только по их location.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:9000;
    set $frontend_upstream http://frontend:4200;

    # ЛК пользователя (собранный статик)
    location /personal/ {
        alias /var/www/public/personal/;
        try_files $uri $uri/ /var/www/public/personal/index.html;
    }

    # Кабинет организации (собранный статик)
    location /org/ {
        alias /var/www/public/org/;
        try_files $uri $uri/ /var/www/public/org/index.html;
    }

    location /api/ {
        fastcgi_pass $backend_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    location / {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
