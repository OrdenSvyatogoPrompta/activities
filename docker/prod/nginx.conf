server {
    # Непривилегированный nginx: порт выше 1024, снаружи доступен только через Caddy
    listen 8080 default;
    server_name activities;

    root /var/www/public;

    server_tokens off;
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Скрытые файлы (.env, .git и т.п.) не отдаём никогда
    location ~ /\. {
        deny all;
    }

    # PHP-файлы лежат в контейнере backend, nginx передаёт ему только путь к скрипту
    location /api/ {
        fastcgi_pass backend:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_hide_header X-Powered-By;
    }

    location / {
        try_files $uri $uri/ /index.html =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
